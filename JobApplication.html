<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Job Application</h2>

    <form>

        <label for="name">Name : </label>
        <input type="text" name="name" id="name">
        <br/>
        <br/>

        <label for="email">Email : </label>
        <input type="email" name="eamil" id="eamil">
        <br/>
        <br/>

        <label for="phone">Phone : </label>
        <input type="tel" name="phone" id="phone">
        <br/>
        <br/>

        <label for="resume">Resume : </label>
        <input type="file" name="resume" id="resume">
        <br/>
        <br/>

        <label for="counter">Experience(in yrs) : </label>
        <input type="number" name="counter" id="counter" min="0" max="50">
        <br/>
        <br/>

        <fieldset>
            <legend>Skills : </legend>

            
            <input type="checkbox" name="ch1" id="ch1">
            <label for="ch1">HTML</label>
            <br/>
            <br/>

           
            <input type="checkbox" name="ch2" id="ch2">
            <label for="ch2">CSS</label>
            <br/>
            <br/>

           
            <input type="checkbox" name="ch3" id="ch3">
            <label for="ch3">Java Script</label>
            <br/>
            <br/>
        </fieldset>
        <br/>
        

        <label for="Education">Highest Education : </label>
        <select name="Education" id="Education">
            <option value="Primary">Primary</option>
            <option value="HighSchool">HighSchool</option>
            <option value="Intermediate">Intermediate</option>
            <option value="UG">UG</option>
            <option value="PG">PG</option>
        </select>
        <br/>
        <br/>

        <fieldset>
            <legend>Availability : </legend>

            <label for="r1">Full Time : </label>
            <input type="radio" name="r1" id="r1">
            <br/>

            <label for="r2">Part Time : </label>
            <input type="radio" name="r1" id="r2">
            <br/>
        </fieldset>
        <br/>

        <label for="ta1">Additional Comments : </label>
        <br/>
        <textarea name="ta1" id="ta1" cols="50" rows="10"></textarea>
        <br/>
        <br/>

        <input type="submit" value="Submit Application">

    </form>
</body>
</html>
