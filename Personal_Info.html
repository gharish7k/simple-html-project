<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Complex Form</h2>

    <form>

        <fieldset>

            <legend>Personal Info : </legend>

            <label for="name">Name : </label>
            <input type="text" name="name" id="name">
            <br/>
            <br/>

            <label for="email">Email : </label>
            <input type="email" name="eamil" id="eamil">
            <br/>
            <br/>

            <label for="phone">Phone : </label>
            <input type="tel" name="phone" id="phone">
            <br/>
            <br/>

            <label for="date">Date of Birth : </label>
            <input type="date" name="date" id="date">
            <br/>
            <br/>

            <span>Gender : </span>
            
            <input type="radio" name="r1" id="r1">
            <label for="r1">Full Time : </label>
            

            <input type="radio" name="r1" id="r2">
            <label for="r2">Part Time : </label>
            <br/>
            <br/>

            <label for="country">Country : </label>
            <select name="country" id="country">

                <option value="india">India</option>
                <option value="US">US</option>

            </select>
            <br/>

        </fieldset>

        <fieldset>

            <legend>Address : </legend>

            <label for="street">Street : </label>
            <input type="text" name="street" id="street">
            <br/>
            <br/>

            <label for="city">City : </label>
            <input type="text" name="city" id="city">
            <br/>
            <br/>

            <label for="state">State : </label>
            <input type="text" name="state" id="state">
            <br/>
            <br/>

            <label for="zip">Zip Code : </label>
            <input type="text" name="zip" id="zip">
            <br/>
            <br/>

        </fieldset>

        <fieldset>
            <legend>Other Info : </legend>

            <label for="ta1">Comments : </label>
            <br/>
            <textarea name="ta1" id="ta1" cols="50" rows="10"></textarea>

            <label for="ch1">I agree to the terms of service : </label>
            <input type="checkbox" name="ch1" id="ch1">

        </fieldset>

        <input type="submit" value="submit">

    </form>
</body>
</html>
