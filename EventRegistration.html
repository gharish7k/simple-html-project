<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
</head>
<body>
   <h2>Event Registration</h2>
    <form>

        <label for="name">Name : </label>
        <input type="text" name="name" id="name">
        <br/>
        <br/>

        <label for="email">Email : </label>
        <input type="email" name="eamil" id="eamil">
        <br/>
        <br/>

        <label for="phone">Phone : </label>
        <input type="tel" name="phone" id="phone">
        <br/>
        <br/>

        <label for="occupation">Occupation : </label>
        <select name="occupation" id="occupation">
            <option value="student">Student</option>
            <option value="professional">Professional</option>
            <option value="others">Others</option>
        </select>
        <br/>

        <fieldset>
            <legend>Topics of Interest : </legend>

            <label for="ch1">HTML</label>
            <input type="checkbox" name="ch1" id="ch1">
            <br/>
            <br/>

            <label for="ch2">CSS</label>
            <input type="checkbox" name="ch2" id="ch2">
            <br/>
            <br/>

            <label for="ch3">Java Script</label>
            <input type="checkbox" name="ch3" id="ch3">
            <br/>
            <br/>
        </fieldset>

        <label for="ta1">Comments : </label>
        <br/>
        <textarea name="ta1" id="ta1" cols="50" rows="10"></textarea>

        <input type="submit" value="Register">
    </form>

</body>
</html>
